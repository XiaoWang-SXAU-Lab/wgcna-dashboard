name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: XiaoWang-SXAU-Lab/rs-wgcna
          path: rs_WGCNA

      - uses: actions/checkout@v4
        with:
          repository: XiaoWang-SXAU-Lab/regutrace
          path: regutrace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Build frontend
        run: |
          cd frontend
          pnpm install
          pnpm build
          cd ..
          rm -rf backend/internal/web/dist
          cp -r frontend/dist backend/internal/web/dist

      - name: Build Rust worker
        run: |
          cd rs_WGCNA
          cargo build --release --bin rs-wgcna-worker
          mkdir -p ../build/macos
          cp target/release/rs-wgcna-worker ../build/macos/rs-wgcna-worker

      - name: Build ReguTrace
        run: |
          cd regutrace
          cargo build --release --bin regutrace
          cp target/release/regutrace ../build/macos/regutrace

      - name: Build Go binary (macOS)
        run: |
          mkdir -p build/macos
          cd backend
          CGO_ENABLED=1 go build -tags release -o ../build/macos/rsWGCNA ./cmd/server

      - name: Install R 4.5.1 and plot packages
        run: |
          if [ "$(uname -m)" = "arm64" ]; then
            R_URL="https://cloud.r-project.org/bin/macosx/big-sur-arm64/base/R-4.5.1-arm64.pkg"
          else
            R_URL="https://cloud.r-project.org/bin/macosx/big-sur-x86_64/base/R-4.5.1-x86_64.pkg"
          fi
          curl -fL --retry 3 -o /tmp/R-4.5.1.pkg "$R_URL"
          sudo installer -pkg /tmp/R-4.5.1.pkg -target /
          /Library/Frameworks/R.framework/Resources/bin/Rscript -e 'stopifnot(as.character(getRversion()) == "4.5.1")'
          sudo /Library/Frameworks/R.framework/Resources/bin/Rscript -e 'install.packages(c("jsonlite","ggplot2","patchwork","circlize","igraph","svglite"), repos="https://cloud.r-project.org")'
          sudo /Library/Frameworks/R.framework/Resources/bin/Rscript -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install("ComplexHeatmap", ask=FALSE, update=FALSE)'

      - name: Assemble app bundle and ad-hoc sign
        run: |
          mkdir -p build/macos/rsWGCNA.app/Contents/MacOS
          mkdir -p build/macos/rsWGCNA.app/Contents/Resources
          mkdir -p build/macos/rsWGCNA.app/Contents/Frameworks
          cp build/macos/rsWGCNA build/macos/rsWGCNA.app/Contents/MacOS/rsWGCNA
          cp build/macos/rs-wgcna-worker build/macos/rsWGCNA.app/Contents/MacOS/rs-wgcna-worker
          cp build/macos/regutrace build/macos/rsWGCNA.app/Contents/MacOS/regutrace
          cp packaging/Info.plist build/macos/rsWGCNA.app/Contents/Info.plist
          cp packaging/icon.icns build/macos/rsWGCNA.app/Contents/Resources/icon.icns
          cp -R /Library/Frameworks/R.framework build/macos/rsWGCNA.app/Contents/Frameworks/
          FR="build/macos/rsWGCNA.app/Contents/Frameworks/R.framework"
          MACOS_DIR="build/macos/rsWGCNA.app/Contents/MacOS"
          # Framework-root symlinks (Headers/PrivateHeaders/R/Resources) cannot be
          # sealed by codesign; Rscript does not need them at runtime.
          find "$FR" -maxdepth 1 -type l -delete
          codesign --force --deep -s - "$FR"
          codesign --force -s - "$MACOS_DIR/rs-wgcna-worker"
          codesign --force -s - "$MACOS_DIR/regutrace"
          codesign --force -s - build/macos/rsWGCNA.app

      - name: Create DMG
        run: |
          mkdir -p build/macos/stage
          cp -R build/macos/rsWGCNA.app build/macos/stage/
          ln -s /Applications build/macos/stage/Applications
          hdiutil create -volname rsWGCNA \
            -srcfolder build/macos/stage \
            -ov -format UDZO build/macos/rsWGCNA-0.6.0.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/macos/rsWGCNA-0.6.0.dmg

  windows:
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RUSTFLAGS: '-C link-self-contained=yes'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: XiaoWang-SXAU-Lab/rs-wgcna
          path: rs_WGCNA

      - uses: actions/checkout@v4
        with:
          repository: XiaoWang-SXAU-Lab/regutrace
          path: regutrace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust GNU toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum

      - name: Install mingw (cgo compiler)
        run: choco install mingw -y

      - name: Build frontend
        shell: pwsh
        run: |
          cd frontend
          pnpm install
          pnpm build
          Remove-Item -Recurse -Force ../backend/internal/web/dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse dist ../backend/internal/web/dist

      - name: Build Rust worker
        shell: pwsh
        run: |
          cd rs_WGCNA
          cargo +stable-x86_64-pc-windows-gnu build --locked --release --bin rs-wgcna-worker
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\dist-windows" -Force | Out-Null
          Copy-Item target\release\rs-wgcna-worker.exe "$env:GITHUB_WORKSPACE\dist-windows\rs-wgcna-worker.exe" -Force

      - name: Test ReguTrace in release mode
        working-directory: regutrace
        run: cargo +stable-x86_64-pc-windows-gnu test --release --locked --workspace

      - name: Build ReguTrace
        shell: pwsh
        run: |
          cd regutrace
          cargo +stable-x86_64-pc-windows-gnu build --locked --release --bin regutrace
          Copy-Item target\release\regutrace.exe "$env:GITHUB_WORKSPACE\dist-windows\regutrace.exe" -Force

      - name: Build Go executable (Windows)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\dist-windows" -Force | Out-Null
          Set-Location "$env:GITHUB_WORKSPACE\backend"
          $env:CGO_ENABLED = '1'
          go build -tags release -ldflags "-H=windowsgui" -o "$env:GITHUB_WORKSPACE\dist-windows\rsWGCNA.exe" ./cmd/server

      - name: Verify sidecar layout
        shell: pwsh
        run: |
          foreach ($name in @('rsWGCNA.exe', 'rs-wgcna-worker.exe', 'regutrace.exe')) {
            $path = Join-Path "$env:GITHUB_WORKSPACE\dist-windows" $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "missing sidecar layout file: $path"
            }
          }

      - name: Stamp Windows executable version resources
        shell: pwsh
        run: |
          $windres = (Get-Command windres.exe -ErrorAction SilentlyContinue).Source
          if (-not $windres) {
            $windres = (Get-Command x86_64-w64-mingw32-windres.exe -ErrorAction Stop).Source
          }
          ./scripts/set-windows-version-info.ps1 -Directory dist-windows -Windres $windres
          foreach ($config in @('rsWGCNA-payload', 'rsWGCNA-installer')) {
            [xml]$xml = Get-Content -Raw ".signpath/artifact-configurations/$config.xml"
            foreach ($entry in $xml.'artifact-configuration'.'zip-file'.'pe-file') {
              $app = (Get-Item -LiteralPath 'dist-windows/rsWGCNA.exe').VersionInfo
              if ($entry.'product-name' -cne $app.ProductName -or $entry.'product-version' -cne $app.ProductVersion) {
                throw "Update $config.xml to match the Windows product name and version."
              }
            }
          }

      - name: Install R and plot packages
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://cloud.r-project.org/bin/windows/base/old/4.5.1/R-4.5.1-win.exe' -OutFile R-win.exe
          Start-Process -Wait -FilePath .\R-win.exe -ArgumentList '/SILENT','/DIR=C:\R'
          & 'C:\R\bin\Rscript.exe' -e 'install.packages(c("jsonlite","ggplot2","patchwork","circlize","igraph","svglite"), repos="https://cloud.r-project.org", Ncpus=2)'
          & 'C:\R\bin\Rscript.exe' -e 'if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager", repos="https://cloud.r-project.org"); BiocManager::install("ComplexHeatmap", ask=FALSE, update=FALSE)'

      - name: Bundle R runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\dist-windows\R" -Force | Out-Null
          Copy-Item 'C:\R\*' "$env:GITHUB_WORKSPACE\dist-windows\R" -Recurse -Force

      - name: Check SignPath configuration
        id: signpath
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNING_REQUIRED: ${{ vars.RSWGCNA_SIGNING_ENABLED }}
        run: |
          $required = "$env:SIGNING_REQUIRED".ToLowerInvariant()
          if ($env:TOKEN -and $env:ORG_ID -and $env:PROJECT -and $env:POLICY) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "SignPath signing enabled; a test tag can be signed while RSWGCNA_SIGNING_ENABLED remains off."
          } elseif ($required -eq 'true' -or $required -eq '1') {
            throw 'RSWGCNA_SIGNING_ENABLED is true but SignPath secrets/vars are missing. Refusing to release unsigned Windows binaries.'
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning 'SignPath credentials missing; Windows artifacts will be unsigned.'
          }

      - name: Upload unsigned Windows payload for SignPath
        id: upload-payload
        uses: actions/upload-artifact@v4
        with:
          name: windows-payload-unsigned
          path: |
            dist-windows/rsWGCNA.exe
            dist-windows/rs-wgcna-worker.exe
            dist-windows/regutrace.exe
          if-no-files-found: error

      - name: Sign Windows payload with SignPath
        if: startsWith(github.ref, 'refs/tags/') && steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG_PAYLOAD != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG_PAYLOAD || 'rsWGCNA-payload' }}
          github-artifact-id: ${{ steps.upload-payload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-payload

      - name: Apply signed Windows payload
        if: startsWith(github.ref, 'refs/tags/') && steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $target = Join-Path "$env:GITHUB_WORKSPACE" 'dist-windows'
          foreach ($archive in @(Get-ChildItem -Path 'signed-payload' -Recurse -File -Filter '*.zip')) {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath (Join-Path 'signed-payload' 'extracted') -Force
          }
          $files = @(Get-ChildItem -Path 'signed-payload' -Recurse -File -Filter '*.exe')
          if ($files.Count -eq 0) { throw 'SignPath returned no signed executable payload.' }
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $target $file.Name) -Force
          }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          $app = (Get-Item -LiteralPath 'dist-windows/rsWGCNA.exe').VersionInfo
          $installer = (Get-Item -LiteralPath 'dist-windows/rsWGCNA-setup-0.6.0.exe').VersionInfo
          if ($installer.ProductName -cne $app.ProductName -or $installer.ProductVersion -cne $app.ProductVersion) {
            throw 'Installer version metadata must match the Windows executables.'
          }

      - name: Upload unsigned Windows installer for SignPath
        id: upload-installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-unsigned
          path: dist-windows/rsWGCNA-setup-0.6.0.exe
          if-no-files-found: error

      - name: Sign Windows installer with SignPath
        if: startsWith(github.ref, 'refs/tags/') && steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG_INSTALLER != '' && vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG_INSTALLER || 'rsWGCNA-installer' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installer

      - name: Apply signed Windows installer
        if: startsWith(github.ref, 'refs/tags/') && steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $target = Join-Path "$env:GITHUB_WORKSPACE" 'dist-windows'
          foreach ($archive in @(Get-ChildItem -Path 'signed-installer' -Recurse -File -Filter '*.zip')) {
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath (Join-Path 'signed-installer' 'extracted') -Force
          }
          $files = @(Get-ChildItem -Path 'signed-installer' -Recurse -File -Filter '*.exe')
          if ($files.Count -eq 0) { throw 'SignPath returned no signed installer.' }
          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $target $file.Name) -Force
          }

      - name: Verify Authenticode signatures
        if: startsWith(github.ref, 'refs/tags/') && steps.signpath.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @(
            'dist-windows\rsWGCNA.exe',
            'dist-windows\rs-wgcna-worker.exe',
            'dist-windows\regutrace.exe',
            'dist-windows\rsWGCNA-setup-0.6.0.exe'
          )
          foreach ($relative in $files) {
            $path = Join-Path "$env:GITHUB_WORKSPACE" $relative
            $sig = Get-AuthenticodeSignature -LiteralPath $path
            if ($sig.Status -ne 'Valid') {
              throw "invalid Authenticode signature ($($sig.Status)): $path"
            }
          }

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            'dist-windows\rsWGCNA.exe',
            'dist-windows\rs-wgcna-worker.exe',
            'dist-windows\regutrace.exe',
            'dist-windows\rsWGCNA-setup-0.6.0.exe'
          )
          $lines = foreach ($relative in $files) {
            $path = Join-Path "$env:GITHUB_WORKSPACE" $relative
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $path)"
          }
          $lines | Set-Content -LiteralPath 'dist-windows\SHA256SUMS.txt' -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-windows/rsWGCNA-setup-0.6.0.exe
            dist-windows/rsWGCNA.exe
            dist-windows/rs-wgcna-worker.exe
            dist-windows/regutrace.exe
            dist-windows/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require signed release configuration
        env:
          SIGNING_ENABLED: ${{ vars.RSWGCNA_SIGNING_ENABLED }}
        run: |
          if [ "$SIGNING_ENABLED" != "true" ]; then
            echo "::error::Public releases are blocked until code signing is configured. Build artifacts are still available for testing; see docs/RELEASE-SECURITY.md."
            exit 1
          fi

      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            macos-dmg/*.dmg
            windows-installer/*.exe
            windows-installer/SHA256SUMS.txt
